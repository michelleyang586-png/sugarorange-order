
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>餘有榮焉｜後台訂單管理平台</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f7f5f0;
  color: #38332e;
  font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
}
header {
  background: #d97836;
  color: white;
  padding: 20px 16px;
  text-align: center;
}
header .brand-layout { display:flex; align-items:center; justify-content:center; min-height:36px; }
header .brand-title { margin:0; font-size:clamp(16px,4.3vw,26px); font-weight:700; line-height:1.35; white-space:nowrap; }
@media(max-width:380px){header{padding:17px 8px}header .brand-title{font-size:16px}}
main { max-width: 800px; margin: auto; padding: 14px; }
nav {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin-bottom: 16px;
}
button {
  border: 0;
  border-radius: 9px;
  padding: 11px;
  font: inherit;
  cursor: pointer;
}
nav button { background: #eee6db; }
nav button.active { background: #d97836; color: white; }
.primary { background: #d97836; color: white; }
.secondary { background: #eee6db; }
.danger { background: #fff0eb; color: #a33c25; }
.card {
  background: white;
  border-radius: 13px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px #00000009;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.summary { text-align: center; }
.summary strong { display: block; font-size: 25px; color: #d97836; }
.summary span { font-size: 13px; color: #777; }
label { display: block; margin: 12px 0 5px; font-size: 14px; }
input, select, textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font: inherit;
  background: white;
}
textarea { min-height: 65px; }
h2 { font-size: 19px; }
h3 { margin: 0 0 10px; font-size: 17px; }
p { line-height: 1.6; }
.muted { color: #777; font-size: 13px; }
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions button { flex: 1; }
.pill {
  display: inline-block;
  background: #f8eadc;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
}

/* 狀態顏色：待處理暖橘、已完成柔和綠；文字搭配底色提升辨識度 */
.pill.status-pending {
  background: #FFF0DB;
  color: #955000;
  border: 1px solid #F2C68B;
  font-weight: 700;
}
.pill.status-done {
  background: #E3F2E7;
  color: #24643C;
  border: 1px solid #B1D8BD;
  font-weight: 700;
}

.hide { display: none; }
.notice {
  background: #fff3df;
  border-radius: 9px;
  padding: 12px;
  margin-bottom: 12px;
  font-size: 14px;
}
.delivery {
  border: 1px solid #eee;
  border-radius: 10px;
  padding: 12px;
  margin-top: 12px;
}
.total { font-size: 22px; color: #c8692c; font-weight: bold; }
/* 篩選條件與下方訂單卡片保持舒適間距 */
#orderList, #paymentList, #shippingList { margin-top: 24px; }
.dashboard-title { margin:16px 0 10px; font-size:18px; }
.dashboard-title small { font-size:12px; font-weight:400; color:#777; margin-left:8px; }
.dashboard-grid { margin-bottom:16px; }
.dashboard-tile { width:100%; cursor:pointer; font-family:inherit; color:inherit; border:1px solid #eee; }
.dashboard-tile small { display:block; color:#888; font-size:11px; margin-top:6px; }
.dashboard-tile:focus-visible { outline:3px solid #d97836; }
.dashboard-hint { background:#fff3df; padding:10px 12px; border-radius:9px; margin-bottom:12px; font-size:13px; }
@media print {
  header, nav, button, .notice, .no-print { display: none !important; }
  body { background: white; }
  .card { box-shadow: none; border: 1px solid #ddd; }
}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>

  if (!liff.isLoggedIn()) {
    liff.login();
    return false;
  }

  return true;

async function getAdminLineUserId() {
  if (!liff.isLoggedIn()) {
    throw new Error('請先登入 LINE');
  }

  const profile = await liff.getProfile();
  return profile.userId;

</script>
</head>

<body>
<header>
  <div class="brand-layout"><h1 class="brand-title">餘有榮焉 🍊 訂單進銷存管理系統</h1></div>
</header>

<main>
  <div class="notice">
  🍊 餘有榮焉訂單管理系統<br>
  訂單、收款及出貨資料會同步至 Google 試算表。
  請確認資料正確後再送出。
</div>

  <h2 class="dashboard-title">今日營運總覽 <small id="dashboardDate"></small></h2>
  <div class="grid dashboard-grid">
    <button type="button" class="card summary dashboard-tile" data-dashboard="new"><strong id="todayNewCount">0</strong><span>今日新增訂單</span><small>今天建立的訂單</small></button>
    <button type="button" class="card summary dashboard-tile" data-dashboard="ship"><strong id="todayShipCount">0</strong><span>今日預計出貨</span><small id="todayShipDetail">0 筆配送 · 0 盒</small></button>
    <button type="button" class="card summary dashboard-tile" data-dashboard="pickup"><strong id="todayPickupCount">0</strong><span>今日預計自取</span><small id="todayPickupDetail">0 筆配送 · 0 盒</small></button>
    <button type="button" class="card summary dashboard-tile" data-dashboard="unpaid"><strong id="todayUnpaidCount">0</strong><span>目前待收款</span><small>不限訂單建立日期</small></button>
  </div>

  <nav>

  <section id="orders">

    <label for="orderStatusFilter">訂單狀態</label>
    <select id="orderStatusFilter"><option value="all">全部</option><option value="pending" selected>未完成</option><option value="completed">已完成</option></select>
    <label for="orderTypeFilter">配送方式</label>
    <select id="orderTypeFilter"><option value="all">全部配送</option><option value="宅配">宅配</option><option value="自取">自取</option></select>

  <section id="payments" class="hide">
    <h2>收款管理</h2>
    <label for="paymentFilter">收款狀態</label>
    <select id="paymentFilter"><option value="all">全部</option><option value="unpaid" selected>未收款</option><option value="paid">已收款</option></select>
    <label for="paymentTypeFilter">配送方式</label>
    <select id="paymentTypeFilter"><option value="all">全部配送</option><option value="宅配">宅配</option><option value="自取">自取</option></select>

  <section id="shipping" class="hide">
    <div class="row">
      <h2>出貨管理</h2>
      <button class="secondary" type="button" onclick="printShippingList()">列印／儲存列印版</button>

    <label for="shippingFilter">出貨狀態</label>
    <select id="shippingFilter"><option value="all">全部</option><option value="pending" selected>未出貨</option><option value="shipped">已出貨</option></select>
    <label for="shippingTypeFilter">配送方式</label>
    <select id="shippingTypeFilter"><option value="all">全部配送</option><option value="宅配">宅配</option><option value="自取">自取</option></select>
    <div id="shippingList"></div>
  </section>

  <section id="create" class="hide">
    <h2>新增電話／口頭訂單</h2>
    <div class="card">
      <label>訂購人姓名</label>
      <input id="buyerName" placeholder="請輸入姓名">

      <label>訂購人電話</label>
      <input id="buyerPhone" type="tel" placeholder="09xxxxxxxx">

      <label>訂單備註</label>
      <textarea id="orderNote"></textarea>

      <div id="deliveryForms"></div>

      <button class="secondary" onclick="addDelivery()">
        ＋ 新增宅配地址／自取
      </button>

      <p class="muted" id="pricingNotice">
        砂糖橘每盒 NT$400；宅配每 4 盒一件，每件 NT$150。
        不同宅配地址分開計算運費。
      </p>

      <p class="total" id="estimate">NT$0</p>

      <button class="primary" style="width:100%" onclick="createOrder()">
        建立訂單
      </button>

</main>

<script>
"use strict";

// 正式管理後台：訂單資料以後端 Google Sheets 為準。
let PRICE = 400;
let BOXES_PER_PIECE = 4;
let SHIPPING_FEE = 150;

const $ = id => document.getElementById(id);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function money(value) {
  return Number.isFinite(Number(value)) ? "NT$" + Number(value).toLocaleString("zh-TW") : "金額待核對";
}

function today() {
  return new Date().toLocaleDateString("sv-SE", {
    timeZone: "Asia/Taipei"
  });
}

function makeId() {
  return "SO-" + Date.now() + "-" +
    Math.random().toString(36).slice(2, 7).toUpperCase();
}



const ADMIN_SESSION_KEY = 'sugarorangeAdminSession';

function getAdminSession() {
  try {
    const saved = JSON.parse(localStorage.getItem(ADMIN_SESSION_KEY) || 'null');

    if (
      !saved ||
      !saved.token ||
      !saved.expires ||
      saved.expires <= Math.floor(Date.now() / 1000)
    ) {
      localStorage.removeItem(ADMIN_SESSION_KEY);
      return null;
    }

    return saved;
  } catch {
    localStorage.removeItem(ADMIN_SESSION_KEY);
    return null;
  }
}

function saveAdminSession(data) {
  localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({
    token: data.token,
    expires: data.expires,
    lineUserId: data.lineUserId
  }));
}

function clearAdminSession() {
  localStorage.removeItem(ADMIN_SESSION_KEY);
}  
async function requireAdminCredentials() {
  const savedSession = getAdminSession();
  if (savedSession) return { 'X-Admin-Session': savedSession.token };

  const password = adminPassword || window.prompt('管理員登入已到期，請重新輸入管理員密碼');
  if (!password) throw new Error('尚未輸入管理員密碼，操作已取消');

  // 先重新建立 7 天登入憑證，成功後才允許修改資料。
  const session = await loginAdminForSevenDays(password);
  adminPassword = '';
  sessionStorage.removeItem('adminPassword');
  return { 'X-Admin-Session': session.token };
}

async function loginAdminForSevenDays(password) {
  const response = await fetch(
    'https://sugarorange-api.vercel.app/api/order',
    {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Admin-Password': password,
        'Authorization': 'Bearer ' + (liff.getAccessToken() || '')
      },
      body: JSON.stringify({
        action: 'adminLogin'
      })
    }
  );

  const result = await response.json();

  if (!response.ok || result.status !== 'success') {
    throw new Error(result.message || '管理員登入失敗');
  }

  saveAdminSession(result);
  return result;
}  
let adminPassword = sessionStorage.getItem('adminPassword') || '';
async function loadOrdersFromGoogle() {
  const savedSession = getAdminSession();
const password = savedSession ? '' : (adminPassword || window.prompt('請輸入管理員密碼'));

  if (!savedSession && !password) {
  throw new Error('尚未輸入管理員密碼');
}

  const response = await fetch(
    'https://sugarorange-api.vercel.app/api/order?action=getOrders',
    {
      method: 'GET',
      headers: {
  ...(savedSession
    ? { 'X-Admin-Session': savedSession.token }
    : { 'X-Admin-Password': password }),
  'Authorization': 'Bearer ' + (liff.getAccessToken() || '')
}
    }
  );

  const result = await response.json();

  if (!response.ok || result.status !== 'success') {
  if (savedSession && (response.status === 401 || response.status === 403)) {
    clearAdminSession();
    throw new Error('管理員登入已失效，請重新整理此頁面並輸入密碼。');
  }

  throw new Error(result.message || '讀取訂單失敗');
}
  
  if (!savedSession && password) {
  await loginAdminForSevenDays(password);
}

adminPassword = '';
sessionStorage.removeItem('adminPassword');
  
  return result;
  }


let orders = [];


function deliveryTotal(d) {
  return d.amount !== undefined && d.amount !== null
    ? Number(d.amount)
    : NaN;
}

function allDeliveries() {
  return orders.flatMap(order =>
    order.deliveries.map(d => ({ ...d, order }))
  );
}

function taiwanToday() {
  return new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
function normalizedDate(value) {
  if (!value) return '';
  const str = String(value).trim();
  const match = str.match(/^(\d{4})[-\/]([01]?\d)[-\/]([0-3]?\d)/);
  if (match) return `${match[1]}-${match[2].padStart(2,'0')}-${match[3].padStart(2,'0')}`;
  return '';
}
function todayDashboardData() {
  const today = taiwanToday();
  const ds = allDeliveries();
  const ship = ds.filter(d=>d.type==='宅配' && !d.shipped && normalizedDate(d.shipDate)===today);
  const pickup = ds.filter(d=>d.type==='自取' && !d.shipped && normalizedDate(d.shipDate)===today);
  return {today, newly:orders.filter(o=>normalizedDate(o.createdAt)===today),ship,pickup,unpaid:ds.filter(d=>!d.paid)};
}
function renderSummary() {
  const data=todayDashboardData();
  $('dashboardDate').textContent=data.today;
  $('todayNewCount').textContent=data.newly.length+' 筆';
  $('todayShipCount').textContent=data.ship.length+' 筆';
  $('todayPickupCount').textContent=data.pickup.length+' 筆';
  $('todayUnpaidCount').textContent=data.unpaid.length+' 筆';
  $('todayShipDetail').textContent=data.ship.length+' 筆配送 · '+data.ship.reduce((n,d)=>n+d.qty,0)+' 盒';
  $('todayPickupDetail').textContent=data.pickup.length+' 筆配送 · '+data.pickup.reduce((n,d)=>n+d.qty,0)+' 盒';
}
function openDashboardCategory(category) {
  const data=todayDashboardData();
  const hint=$('dashboardHint');
  const q=$('search');
  q.value='';
  if(category==='new') {
    switchPage('orders');
    $('orderStatusFilter').value='all';
    $('orderTypeFilter').value='all';
    dashboardSelectedOrderIds=new Set(data.newly.map(o=>o.id));
    dashboardSelectedDeliveryIds=null;
    hint.textContent='目前顯示今天新增的訂單。清除搜尋或更改篩選條件即可返回一般訂單清單。';
  } else if(category==='unpaid') {
    switchPage('payments');
    $('paymentFilter').value='unpaid';
    $('paymentTypeFilter').value='all';
    dashboardSelectedOrderIds=null;dashboardSelectedDeliveryIds=null;
    hint.textContent='已切換至所有待收款配送。';
  } else {
    switchPage('orders');
    $('orderStatusFilter').value='all';
    $('orderTypeFilter').value=category==='ship'?'宅配':'自取';
    dashboardSelectedOrderIds=null;
    dashboardSelectedDeliveryIds=new Set((category==='ship'?data.ship:data.pickup).map(d=>d.id));
    hint.textContent=category==='ship'?'目前顯示今天預計出貨、尚未完成的配送。':'目前顯示今天預計自取、尚未交貨的配送。';
  }
  hint.classList.remove('hide');
  renderOrders();renderPayments();
  document.querySelector('nav').scrollIntoView({behavior:'smooth',block:'start'});
}
let dashboardSelectedOrderIds=null;
let dashboardSelectedDeliveryIds=null;
function clearDashboardSelection() {
  dashboardSelectedOrderIds=null;dashboardSelectedDeliveryIds=null;
  $('dashboardHint').classList.add('hide');
}
// 訂單管理以每一筆配送為單位篩選與操作，避免多地址訂單誤操作。
function orderCard(order, visibleDeliveries) {
  const boxes = order.deliveries.reduce((sum,d)=>sum+d.qty,0);
  const total = order.deliveries.reduce((sum,d)=>sum+deliveryTotal(d),0);
  return `
    <div class="card">
      <h3>訂購人：${escapeHTML(order.buyer)}</h3>
      <p class="muted">訂購電話：${escapeHTML(order.phone)}<br>訂單編號：${escapeHTML(order.id)}</p>
      <p>整筆訂單：${boxes} 盒 · <strong>${money(total)}</strong></p>
      ${visibleDeliveries.map(d=>`
        <div class="delivery">
          <div class="row"><strong>${escapeHTML(d.type)} · ${d.qty} 盒</strong>
            <span class="pill ${d.shipped ? 'status-done' : 'status-pending'}">${d.shipped ? (d.type==='自取'?'已交貨':'已出貨') : (d.type==='自取'?'未交貨':'未出貨')}</span></div>
          ${d.type==='宅配' ? `<p>收件人：${escapeHTML(d.name || order.buyer)}<br>收件電話：${escapeHTML(d.phone || order.phone)}<br>地址：${escapeHTML(d.address)}</p>` : `<p>取貨人：${escapeHTML(order.buyer)}<br>電話：${escapeHTML(order.phone)}</p>`}
          <p>應收：<strong>${money(deliveryTotal(d))}</strong>（含運費 ${money(d.shipping)}）</p>
          <p><span class="pill ${d.paid ? 'status-done' : 'status-pending'}">${d.paid?'已收款':'未收款'}</span></p>
          <div class="no-print">
            <label>預計出貨／自取日期</label>
            <input type="date" value="${escapeHTML(d.shipDate)}" data-shipdate="${escapeHTML(d.id)}" ${d.shipped?'disabled':''}>
            <div class="actions" style="margin-top:10px">
              <button class="${d.paid?'secondary':'primary'}" data-payment="${escapeHTML(d.id)}">${d.paid?'取消收款確認':'確認全額收款'}</button>
              <button class="${d.shipped?'secondary':'primary'}" data-shipped="${escapeHTML(d.id)}">${d.shipped?(d.type==='自取'?'取消已交貨':'取消已出貨'):(d.type==='自取'?'確認已交貨':'確認已出貨')}</button>
            </div>
            ${d.type==='自取'&&!d.paid&&!d.shipped ? `<button class="primary" style="margin-top:8px;width:100%" data-pickup-complete="${escapeHTML(d.id)}">收款＋交貨一次完成</button>`:''}
          </div>
        </div>
      `).join('')}
      ${order.note?`<p class="muted">備註：${escapeHTML(order.note)}</p>`:''}
    </div>`;
}

function renderOrders() {
  const q = $('search').value.trim().toLowerCase();
  const status = $('orderStatusFilter').value;
  const type = $('orderTypeFilter').value;
  const cards = orders.map(order => {
    const visible = order.deliveries.filter(d => {
      if(dashboardSelectedOrderIds && !dashboardSelectedOrderIds.has(order.id)) return false;
      if(dashboardSelectedDeliveryIds && !dashboardSelectedDeliveryIds.has(d.id)) return false;
      const matchesType = type==='all'||d.type===type;
      const completed = d.paid && d.shipped;
      const matchesStatus = status==='all'||(status==='completed'?completed:!completed);
      const matchesText = !q || [order.id,order.buyer,order.phone,d.name,d.phone,d.address]
        .some(v=>String(v||'').toLowerCase().includes(q));
      return matchesType&&matchesStatus&&matchesText;
    });
    return visible.length ? orderCard(order,visible) : '';
  }).filter(Boolean);
  $('orderList').innerHTML = cards.join('') || '<div class="card">沒有符合條件的訂單。</div>';
}

function findDelivery(id) {
  for (const order of orders) {
    const delivery = order.deliveries.find(d => d.id === id);
    if (delivery) return delivery;
  }
  return null;
}


async function updatePayment(id) {
  const d = findDelivery(id);
  if (!d) return;

  if (d.paid && d.shipped && d.type === "宅配") {
    alert("宅配已出貨，請先核對後再調整收款。");
    return;
  }

  const question = d.paid
    ? "確定 取消 這筆收款確認？"
    : "確定 已收到 這筆配送的全額款項？";

  if (!confirm(question)) return;

  try {
    const response = await fetch(
      "https://sugarorange-api.vercel.app/api/order",
      {
        method: "POST",
        headers: {
  "Content-Type": "application/json",
  ...await requireAdminCredentials(),
  "Authorization": "Bearer " + (liff.getAccessToken() || "")
},
        body: JSON.stringify({
          action: "markPaid",
          detailId: id,
          paid: !d.paid
        })
      }
    );

    const result = await response.json();

    if (!response.ok || result.status !== "success") {
      if (response.status === 401 || response.status === 403) clearAdminSession();
      throw new Error(result.message || "更新收款失敗");
    }

    d.paid = !d.paid;
    renderAll();
    alert("收款狀態已更新至 Google 試算表");
  } catch (error) {
    alert("更新失敗：" + error.message);
  }
}


function displayBuyer(d) {
  return d.order.buyer || d.name || "姓名未填";
}

function displayRecipient(d) {
  return d.name && d.name !== d.order.buyer ? d.name : "";
}

function displayPhone(d) {

const updatingShipDates = new Set();
async function updateShipDate(id, date) {
  const d = findDelivery(id);
  if (!d || d.shipped || d.shipDate === date || updatingShipDates.has(id)) return;
  updatingShipDates.add(id);

  try {
    const response = await fetch(
      "https://sugarorange-api.vercel.app/api/order",
      {
        method: "POST",
        headers: {
  "Content-Type": "application/json",
  ...await requireAdminCredentials(),
  "Authorization": "Bearer " + (liff.getAccessToken() || "")
},
        body: JSON.stringify({
          action: "setShipDate",
          detailId: id,
          shipDate: date
        })
      }
    );

    const result = await response.json();

    if (!response.ok || result.status !== "success") {
      if (response.status === 401 || response.status === 403) clearAdminSession();
      throw new Error(result.message || "更新出貨日期失敗");
    }

    d.shipDate = date;
    renderAll();
    alert("出貨日期已更新至 Google 試算表");
  } catch (error) {
    renderAll();
    alert("更新失敗：" + error.message);
  } finally {
    updatingShipDates.delete(id);
  }
}



async function updateShipping(id) {
  const d = findDelivery(id);
  if (!d) return;

  if (!d.shipped) {
    if (!d.shipDate) {
      alert("請先安排出貨日期。");
      return;
    }

    if (d.type === "宅配" && !d.paid &&
        !confirm("提醒：這筆宅配訂單尚未收款。確定要先出貨、之後再追蹤收款嗎？")) {
      return;

  const shipped = !d.shipped;

      : "確定 取消 已出貨標記？"
  )) return;

  try {

      "https://sugarorange-api.vercel.app/api/order",
      {
        method: "POST",
        headers: {
  "Content-Type": "application/json",
  ...await requireAdminCredentials(),
  "Authorization": "Bearer " + (liff.getAccessToken() || "")
},
        body: JSON.stringify({

// 現場自取：一次確認收款及交貨；每一步由後端寫入 Sheets，失敗時提示人工核對。
async function completePickup(id, button) {
  const d = findDelivery(id);
  if (!d || d.type !== "自取" || d.paid || d.shipped) return;
  const buyerName = orders.find(o => o.deliveries.some(item => item.id === id))?.buyer || d.name || "姓名未填";
  if (!confirm(`確定「${buyerName}」已現場全額付款並領取 ${d.qty} 盒？\n應收：${money(deliveryTotal(d))}`)) return;
  button.disabled = true;
  let completed = 0;
  try {
    const headers = {
      "Content-Type": "application/json",
      ...await requireAdminCredentials(),
      "Authorization": "Bearer " + (liff.getAccessToken() || "")
    };
    const call = async (action, extra) => {
      const response = await fetch("https://sugarorange-api.vercel.app/api/order", {
        method: "POST", headers,
        body: JSON.stringify({action, detailId:id, ...extra})
      });
      const result = await response.json();
      if (!response.ok || result.status !== "success") {
        if (response.status === 401 || response.status === 403) clearAdminSession();
        throw new Error(result.message || action + " 更新失敗");
      }
    };
    if (!d.shipDate) {
      const date = today();
      await call("setShipDate", {shipDate:date});
      d.shipDate = date;
    }
    await call("markPaid", {paid:true});
    d.paid = true;
    completed = 1;
    await call("markShipped", {shipped:true});
    d.shipped = true;
    completed = 2;
    renderAll();
    alert("已完成收款及交貨，資料已同步 Google Sheets。");
  } catch (error) {
    renderAll();
    alert((completed ? "收款已更新，但交貨更新未完成。" : "快速交貨未全部完成。") +
      "\n請重新整理並核對 Google Sheets，避免重複操作。\n原因：" + error.message);
  } finally {
    button.disabled = false;
  }
}

function collectDeliveries() {
  return [...document.querySelectorAll(".delivery-form")]
    .map((form, index) => ({
      id: "D-" + Date.now() + "-" + index,
      type: form.querySelector(".type").value,
      name: form.querySelector(".name").value.trim(),
      phone: form.querySelector(".phone").value.trim(),
      address: form.querySelector(".address").value.trim(),
      qty: Number(form.querySelector(".qty").value),
      note: form.querySelector(".note").value.trim()
    }));
}

function calculateDelivery(d) {
  const pieces = d.type === "宅配"
    ? Math.ceil(d.qty / BOXES_PER_PIECE)
    : 0;

  return {
    ...d,
    address: d.type === "宅配" ? d.address : "",
    shipping: pieces * SHIPPING_FEE,
    paid: false,
    shipped: false,
    shipDate: ""
  };
}

function estimate() {
  const lines = collectDeliveries();
  let total = 0;

  const forms = document.querySelectorAll(".delivery-form");

  lines.forEach((line, i) => {
    const qty = Number.isInteger(line.qty) && line.qty > 0
      ? line.qty : 0;
    const pieces = line.type === "宅配"
      ? Math.ceil(qty / BOXES_PER_PIECE)
      : 0;
    const shipping = pieces * SHIPPING_FEE;

    total += qty * PRICE + shipping;

    forms[i].querySelector(".freight").textContent =
      `${pieces} 件貨運 · 運費 ${money(shipping)}`;
  });

  $("estimate").textContent = money(total);
  const notice = $("pricingNotice");
  if (notice) notice.textContent = `砂糖橘每盒 ${money(PRICE)}；宅配每 ${BOXES_PER_PIECE} 盒一件，每件 ${money(SHIPPING_FEE)}。不同宅配地址分開計算運費。`;
}

});

$("shippingList").addEventListener("click", event => {
  const quick = event.target.closest("[data-pickup-complete]");
  if (quick) return completePickup(quick.dataset.pickupComplete, quick);
  const payment = event.target.closest("[data-payment]");
  if (payment) return updatePayment(payment.dataset.payment);
  const shipped = event.target.closest("[data-shipped]");
  if (shipped) return updateShipping(shipped.dataset.shipped);
});

addDelivery();
renderAll();

(async function initAdmin() {
  try {
    const lineReady = await initAdminLine();
    if (!lineReady) return;

    const data = await loadOrdersFromGoogle();
    const config = data.settings || {};

PRICE = Number(config.price) > 0
  ? Number(config.price) : 400;

BOXES_PER_PIECE = Number(config.boxesPerPiece) > 0
  ? Number(config.boxesPerPiece) : 4;

SHIPPING_FEE =
  config.shippingPerPiece !== null &&
  config.shippingPerPiece !== undefined &&
  config.shippingPerPiece !== '' &&
  Number.isFinite(Number(config.shippingPerPiece)) &&
  Number(config.shippingPerPiece) >= 0
    ? Number(config.shippingPerPiece)
    : 150;

estimate();

    orders = (data.orders || []).map(row => ({
      id: row[0] || '',
      createdAt: row[1] || '',
      buyer: row[5] || '',
      phone: row[6] || '',
      note: row[16] || '',
      deliveries: (data.details || [])
        .filter(detail => detail[1] === row[0])
        .map(detail => {
          const payment = (data.payments || [])
            .find(p => p[2] === detail[0]);

          return {
            id: detail[0],
            type: detail[4] || '',
            name: detail[2] || '',
            phone: detail[3] || '',
            address: detail[5] || '',
            qty: Number(detail[7]) || 0,
            amount: payment && payment[4] !== undefined && payment[4] !== null && payment[4] !== ''
              ? Number(payment[4])
              : undefined,
            shipping: Number(detail[10]) || 0,
            paid: payment ? payment[7] === '已收款' : false,
            shipped: detail[13] === '已出貨',
            shipDate: detail[11] || '',
            note: detail[17] || ''
          };
        })
    }));

    renderAll();
  } catch (error) {
    alert('無法讀取正式訂單：' + error.message);
  }
})();
</script>
